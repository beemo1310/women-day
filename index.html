<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xin lỗi em</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    overflow: hidden;
}

.container {
    width: 100%;
    max-width: 350px;
    padding: 15px;
    z-index: 10;
}

h1 {
    color: #d81b60;
    font-size: 1.5rem;
    margin-bottom: 15px;
    animation: heartbeat 1.2s infinite;
}

.message {
    background: rgba(255,255,255,0.95);
    padding: 20px;
    border-radius: 15px;
    font-size: 1.2rem;
    font-weight: bold;
}

/* 💓 nhịp tim */
@keyframes heartbeat {
    0% { transform: scale(1); }
    30% { transform: scale(1.08); }
    50% { transform: scale(0.95); }
    70% { transform: scale(1.1); }
    100% { transform: scale(1); }
}

/* ❤️ tim bay */
.heart {
    position: absolute;
    color: #ff4d6d;
    font-size: 18px;
    animation: floatUp 3s linear forwards;
    pointer-events: none;
}

@keyframes floatUp {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-180px); opacity: 0; }
}

/* 💥 nổ tim */
.boom {
    position: absolute;
    font-size: 16px;
    pointer-events: none;
    animation: boomAnim 0.7s ease-out forwards;
}

@keyframes boomAnim {
    to {
        transform: translate(var(--x), var(--y)) scale(0.5);
        opacity: 0;
    }
}

</style>
</head>

<body>

<div class="container">
    <h1>Xin lỗi em 💓</h1>

    <div class="message">
        Em xinh, lỗi anh 💖
    </div>
</div>

<script>
const hearts = ["💓","💖","💗","💘","❤️"];

let maxHearts = 15;
let currentHearts = 0;

function createHeart() {
    if (currentHearts > maxHearts) return;

    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = hearts[Math.floor(Math.random()*hearts.length)];

    heart.style.left = Math.random()*window.innerWidth + "px";
    heart.style.top = window.innerHeight + "px";

    document.body.appendChild(heart);
    currentHearts++;

    setTimeout(()=>{
        heart.remove();
        currentHearts--;
    },3000);
}

setInterval(createHeart, 500);

document.addEventListener("touchstart", boomEffect, {passive:true});
document.addEventListener("click", boomEffect);

function boomEffect(e) {
    const x = e.touches ? e.touches[0].clientX : e.clientX;
    const y = e.touches ? e.touches[0].clientY : e.clientY;

    for (let i=0;i<6;i++){
        const boom = document.createElement("div");
        boom.className = "boom";
        boom.innerHTML = "💖";

        boom.style.left = x + "px";
        boom.style.top = y + "px";

        const angle = Math.random()*Math.PI*2;
        const distance = 40 + Math.random()*40;

        boom.style.setProperty("--x", Math.cos(angle)*distance + "px");
        boom.style.setProperty("--y", Math.sin(angle)*distance + "px");

        document.body.appendChild(boom);

        setTimeout(()=>boom.remove(),700);
    }
}
</script>

</body>
</html>
