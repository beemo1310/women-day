<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Ngày Phụ Nữ Việt Nam 20/10</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            color: #333;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        
        .container {
            max-width: 100%;
            z-index: 10;
            position: relative;
        }
        
        h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #d81b60;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
        }
        
        .message {
            background-color: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            font-size: 1.1rem;
            line-height: 1.6;
        }
        
        .heart {
            color: #e91e63;
            font-size: 1.5rem;
            margin: 0 5px;
        }
        
        .fireworks {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        .firework {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            box-shadow: 0 0 10px #fff;
        }
        
        .flower {
            position: absolute;
            font-size: 2rem;
            opacity: 0.8;
            animation: float 6s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }
        
        .footer {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #666;
        }
        
        .petals {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }
        
        .petal {
            position: absolute;
            width: 15px;
            height: 15px;
            background: linear-gradient(45deg, #ff9a9e, #fad0c4);
            border-radius: 50% 0 50% 50%;
            transform: rotate(45deg);
            opacity: 0.7;
        }
        
        .flower-bouquet {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
        }
        
        .bouquet {
            position: absolute;
            font-size: 2.5rem;
            opacity: 0.7;
            animation: float-bouquet 8s linear infinite;
        }
        
        @keyframes float-bouquet {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }
        
        .sparkle {
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px 2px #fff;
            animation: sparkle 1.5s ease-out infinite;
        }
        
        @keyframes sparkle {
            0% {
                transform: scale(0);
                opacity: 1;
            }
            100% {
                transform: scale(1);
                opacity: 0;
            }
        }
        
        .flower-garden {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100px;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            z-index: 5;
        }
        
        .garden-flower {
            font-size: 2rem;
            opacity: 0.8;
            animation: garden-grow 4s ease-in-out infinite;
        }
        
        @keyframes garden-grow {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
    </style>
</head>
<body>
    <div class="fireworks" id="fireworks"></div>
    <div class="petals" id="petals"></div>
    <div class="flower-bouquet" id="flowerBouquet"></div>
    
    <div class="flower-garden">
        <div class="garden-flower">🌷</div>
        <div class="garden-flower">🌹</div>
        <div class="garden-flower">🌸</div>
        <div class="garden-flower">🌺</div>
        <div class="garden-flower">💐</div>
    </div>
    
    <div class="container">
        <h1>Chúc Mừng Ngày Phụ Nữ Việt Nam 20/10</h1>
        
        <div class="message">
            <p>Gửi lời chúc 20/10 tới tất cả những người phụ nữ tôi yêu!</p>
            <p>Chúc các bạn luôn xinh đẹp, hạnh phúc và thành công trong cuộc sống!</p>
            <p><span class="heart">💐</span></p>
        </div>
        
        <div class="footer">
            <p>Với tất cả tình yêu và sự trân trọng</p>
        </div>
    </div>

    <script>
        // Tạo hiệu ứng pháo hoa
        const fireworksContainer = document.getElementById('fireworks');
        const petalsContainer = document.getElementById('petals');
        const bouquetContainer = document.getElementById('flowerBouquet');
        const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff', '#ff8000'];
        
        // Các loại bó hoa và hoa
        const bouquets = ['💐', '🌷', '🌹', '🌸', '🌺', '🌻', '🥀', '🪷', '🌼'];
        const flowers = ['🌷', '🌹', '🌸', '🌺', '🌻', '💮', '🏵️', '🌼', '🪷'];
        
        function createFirework() {
            const firework = document.createElement('div');
            firework.className = 'firework';
            
            // Vị trí ngẫu nhiên
            const x = Math.random() * window.innerWidth;
            const y = Math.random() * window.innerHeight;
            
            // Màu sắc ngẫu nhiên
            const color = colors[Math.floor(Math.random() * colors.length)];
            
            firework.style.left = `${x}px`;
            firework.style.top = `${y}px`;
            firework.style.backgroundColor = color;
            firework.style.boxShadow = `0 0 10px ${color}`;
            
            fireworksContainer.appendChild(firework);
            
            // Animation pháo hoa nổ
            const particles = 20 + Math.floor(Math.random() * 20);
            for (let i = 0; i < particles; i++) {
                createParticle(x, y, color);
            }
            
            // Xóa pháo hoa sau khi nổ
            setTimeout(() => {
                firework.remove();
            }, 1000);
        }
        
        function createParticle(x, y, color) {
            const particle = document.createElement('div');
            particle.className = 'firework';
            
            particle.style.left = `${x}px`;
            particle.style.top = `${y}px`;
            particle.style.backgroundColor = color;
            particle.style.boxShadow = `0 0 5px ${color}`;
            
            fireworksContainer.appendChild(particle);
            
            // Di chuyển particle
            const angle = Math.random() * Math.PI * 2;
            const speed = 1 + Math.random() * 3;
            const vx = Math.cos(angle) * speed;
            const vy = Math.sin(angle) * speed;
            
            let posX = x;
            let posY = y;
            
            const moveParticle = () => {
                posX += vx;
                posY += vy;
                
                particle.style.left = `${posX}px`;
                particle.style.top = `${posY}px`;
                
                // Mờ dần
                const opacity = parseFloat(particle.style.opacity || 1);
                particle.style.opacity = opacity - 0.02;
                
                if (opacity > 0) {
                    requestAnimationFrame(moveParticle);
                } else {
                    particle.remove();
                }
            };
            
            moveParticle();
        }
        
        // Tạo hoa rơi
        function createFlower() {
            const flower = document.createElement('div');
            flower.className = 'flower';
            flower.innerHTML = flowers[Math.floor(Math.random() * flowers.length)];
            
            // Vị trí ngẫu nhiên
            const x = Math.random() * window.innerWidth;
            
            flower.style.left = `${x}px`;
            flower.style.top = `-50px`;
            
            document.body.appendChild(flower);
            
            // Animation rơi
            const duration = 5 + Math.random() * 5;
            flower.style.animationDuration = `${duration}s`;
            
            // Xóa hoa sau khi rơi
            setTimeout(() => {
                flower.remove();
            }, duration * 1000);
        }
        
        // Tạo cánh hoa rơi
        function createPetal() {
            const petal = document.createElement('div');
            petal.className = 'petal';
            
            // Vị trí ngẫu nhiên
            const x = Math.random() * window.innerWidth;
            
            petal.style.left = `${x}px`;
            petal.style.top = `-20px`;
            
            // Kích thước ngẫu nhiên
            const size = 5 + Math.random() * 10;
            petal.style.width = `${size}px`;
            petal.style.height = `${size}px`;
            
            // Màu sắc ngẫu nhiên
            const hue = Math.random() * 360;
            petal.style.background = `linear-gradient(45deg, hsl(${hue}, 100%, 70%), hsl(${hue}, 100%, 85%))`;
            
            petalsContainer.appendChild(petal);
            
            // Animation rơi
            const duration = 3 + Math.random() * 7;
            const delay = Math.random() * 5;
            
            petal.style.animation = `fall ${duration}s linear ${delay}s forwards`;
            
            // Xóa cánh hoa sau khi rơi
            setTimeout(() => {
                petal.remove();
            }, (duration + delay) * 1000);
        }
        
        // Animation rơi cho cánh hoa
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fall {
                0% {
                    transform: translateY(0) rotate(0deg);
                    opacity: 0.7;
                }
                100% {
                    transform: translateY(100vh) rotate(360deg);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
        
        // Tạo bó hoa bay
        function createFloatingBouquet() {
            const bouquet = document.createElement('div');
            bouquet.className = 'bouquet';
            bouquet.innerHTML = bouquets[Math.floor(Math.random() * bouquets.length)];
            
            // Vị trí ngẫu nhiên
            const x = Math.random() * window.innerWidth;
            
            bouquet.style.left = `${x}px`;
            
            bouquetContainer.appendChild(bouquet);
            
            // Thời gian bay ngẫu nhiên
            const duration = 6 + Math.random() * 6;
            bouquet.style.animationDuration = `${duration}s`;
            
            // Xóa bó hoa sau khi bay
            setTimeout(() => {
                bouquet.remove();
            }, duration * 1000);
        }
        
        // Tạo hiệu ứng lấp lánh
        function createSparkle() {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            
            // Vị trí ngẫu nhiên
            const x = Math.random() * window.innerWidth;
            const y = Math.random() * window.innerHeight;
            
            sparkle.style.left = `${x}px`;
            sparkle.style.top = `${y}px`;
            
            document.body.appendChild(sparkle);
            
            // Xóa hiệu ứng lấp lánh sau khi hoàn thành
            setTimeout(() => {
                sparkle.remove();
            }, 1500);
        }
        
        // Tạo pháo hoa liên tục
        setInterval(createFirework, 300);
        
        // Tạo hoa rơi liên tục
        setInterval(createFlower, 800);
        
        // Tạo cánh hoa rơi liên tục
        setInterval(createPetal, 200);
        
        // Tạo bó hoa bay liên tục
        setInterval(createFloatingBouquet, 1000);
        
        // Tạo hiệu ứng lấp lánh liên tục
        setInterval(createSparkle, 500);
        
        // Thêm hiệu ứng khi nhấn vào màn hình
        document.addEventListener('click', (e) => {
            createFireworkAt(e.clientX, e.clientY);
            createSparkleAt(e.clientX, e.clientY);
            createFlowerAt(e.clientX, e.clientY);
        });
        
        function createFireworkAt(x, y) {
            const color = colors[Math.floor(Math.random() * colors.length)];
            const particles = 30;
            
            for (let i = 0; i < particles; i++) {
                createParticle(x, y, color);
            }
        }
        
        function createSparkleAt(x, y) {
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    const sparkle = document.createElement('div');
                    sparkle.className = 'sparkle';
                    
                    // Vị trí xung quanh điểm chạm
                    const offsetX = (Math.random() - 0.5) * 100;
                    const offsetY = (Math.random() - 0.5) * 100;
                    
                    sparkle.style.left = `${x + offsetX}px`;
                    sparkle.style.top = `${y + offsetY}px`;
                    
                    document.body.appendChild(sparkle);
                    
                    // Xóa hiệu ứng lấp lánh sau khi hoàn thành
                    setTimeout(() => {
                        sparkle.remove();
                    }, 1500);
                }, i * 100);
            }
        }
        
        function createFlowerAt(x, y) {
            for (let i = 0; i < 3; i++) {
                setTimeout(() => {
                    const flower = document.createElement('div');
                    flower.className = 'flower';
                    flower.innerHTML = flowers[Math.floor(Math.random() * flowers.length)];
                    
                    // Vị trí xung quanh điểm chạm
                    const offsetX = (Math.random() - 0.5) * 100;
                    const offsetY = (Math.random() - 0.5) * 100;
                    
                    flower.style.left = `${x + offsetX}px`;
                    flower.style.top = `${y + offsetY}px`;
                    
                    document.body.appendChild(flower);
                    
                    // Xóa hoa sau một thời gian
                    setTimeout(() => {
                        flower.remove();
                    }, 3000);
                }, i * 200);
            }
        }
    </script>
</body>
</html>
