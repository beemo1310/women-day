<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Ngày Phụ Nữ Việt Nam 20/10</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            color: #333;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        .container {
            max-width: 100%;
            z-index: 10;
            position: relative;
        }
        
        h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #d81b60;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
        }
        
        .message {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            font-size: 1.1rem;
            line-height: 1.6;
            backdrop-filter: blur(5px);
        }
        
        .heart {
            color: #e91e63;
            font-size: 1.5rem;
            margin: 0 5px;
        }
        
        .fireworks {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        .firework {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            will-change: transform, opacity;
        }
        
        .flower {
            position: absolute;
            font-size: 1.8rem;
            opacity: 0.8;
            pointer-events: none;
            z-index: 2;
            will-change: transform, opacity;
        }
        
        .footer {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #666;
        }
        
        .touch-flowers {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }
        
        .touch-flower {
            position: absolute;
            font-size: 1.8rem;
            pointer-events: none;
            will-change: transform, opacity;
        }
        
        .performance-warning {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 0.8rem;
            z-index: 100;
            display: none;
        }
        
        /* Tối ưu animation cho mobile */
        @media (max-width: 768px) {
            .flower {
                font-size: 1.5rem;
            }
            .touch-flower {
                font-size: 1.5rem;
            }
            h1 {
                font-size: 1.5rem;
            }
            .message {
                font-size: 1rem;
                padding: 15px;
            }
        }
        
        /* Giảm hiệu ứng cho thiết bị hiệu suất thấp */
        @media (max-width: 480px) {
            .flower {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="fireworks" id="fireworks"></div>
    <div class="touch-flowers" id="touchFlowers"></div>
    
    <div class="container">
        <h1>Chúc Mừng Ngày Phụ Nữ Việt Nam 20/10</h1>
        
        <div class="message">
            <p>Gửi lời chúc 20/10 tới tất cả những người phụ nữ tôi yêu!</p>
            <p>Chúc các bạn luôn xinh đẹp, hạnh phúc và thành công trong cuộc sống!</p>
            <p><span class="heart">💐</span></p>
        </div>
        
        <div class="footer">
            <p>Với tất cả tình yêu và sự trân trọng</p>
        </div>
    </div>
    
    <div class="performance-warning" id="performanceWarning">
        Đang tối ưu hiệu ứng để giảm lag...
    </div>

    <script>
        // Tối ưu hóa hiệu suất cho mobile
        const fireworksContainer = document.getElementById('fireworks');
        const touchContainer = document.getElementById('touchFlowers');
        const performanceWarning = document.getElementById('performanceWarning');
        
        // Giới hạn số lượng phần tử để tránh lag
        const MAX_FIREWORKS = 15;
        const MAX_TOUCH_FLOWERS = 10;
        const MAX_FLOWERS = 8;
        
        let currentFireworks = 0;
        let currentTouchFlowers = 0;
        let currentFlowers = 0;
        
        const colors = ['#ff0000', '#ffff00', '#ff00ff', '#00ffff', '#ff8000'];
        const flowers = ['🌷', '🌹', '🌸', '🌺', '🌻', '💮', '🌼'];
        
        // Biến kiểm soát hiệu suất
        let isLowPerformance = false;
        let lastTouchTime = 0;
        const TOUCH_THROTTLE = 100; // ms
        
        // Kiểm tra hiệu suất
        function checkPerformance() {
            const startTime = performance.now();
            for (let i = 0; i < 1000000; i++) {
                Math.sqrt(i);
            }
            const endTime = performance.now();
            
            if (endTime - startTime > 50) {
                isLowPerformance = true;
                performanceWarning.style.display = 'block';
                setTimeout(() => {
                    performanceWarning.style.display = 'none';
                }, 3000);
            }
        }
        
        // Theo dõi sự kiện chạm (tối ưu hóa)
        document.addEventListener('touchstart', handleTouch, { passive: true });
        document.addEventListener('touchmove', handleTouch, { passive: true });
        document.addEventListener('touchend', handleTouchEnd);
        
        // Theo dõi sự kiện chuột
        document.addEventListener('mousedown', handleMouse);
        document.addEventListener('mousemove', handleMouse);
        document.addEventListener('mouseup', handleMouseEnd);
        
        let isTouching = false;
        let touchX = 0;
        let touchY = 0;
        
        function handleTouch(e) {
            e.preventDefault();
            const now = Date.now();
            if (now - lastTouchTime < TOUCH_THROTTLE) return;
            lastTouchTime = now;
            
            isTouching = true;
            const touch = e.touches[0];
            touchX = touch.clientX;
            touchY = touch.clientY;
            
            if (currentTouchFlowers < MAX_TOUCH_FLOWERS) {
                createTouchFlowers(touchX, touchY);
            }
        }
        
        function handleTouchEnd() {
            isTouching = false;
        }
        
        function handleMouse(e) {
            if (e.type === 'mousedown' || (e.type === 'mousemove' && e.buttons === 1)) {
                isTouching = true;
                touchX = e.clientX;
                touchY = e.clientY;
                
                if (currentTouchFlowers < MAX_TOUCH_FLOWERS) {
                    createTouchFlowers(touchX, touchY);
                }
            }
        }
        
        function handleMouseEnd() {
            isTouching = false;
        }
        
        // Tạo hoa theo ngón tay (tối ưu)
        function createTouchFlowers(x, y) {
            if (!isTouching || currentTouchFlowers >= MAX_TOUCH_FLOWERS) return;
            
            const flowerCount = isLowPerformance ? 1 : 2;
            
            for (let i = 0; i < flowerCount; i++) {
                setTimeout(() => {
                    if (currentTouchFlowers >= MAX_TOUCH_FLOWERS) return;
                    
                    const flower = document.createElement('div');
                    flower.className = 'touch-flower';
                    flower.innerHTML = flowers[Math.floor(Math.random() * flowers.length)];
                    
                    const offsetX = (Math.random() - 0.5) * 60;
                    const offsetY = (Math.random() - 0.5) * 60;
                    
                    flower.style.left = `${x + offsetX}px`;
                    flower.style.top = `${y + offsetY}px`;
                    flower.style.fontSize = `${1.2 + Math.random() * 0.6}rem`;
                    
                    touchContainer.appendChild(flower);
                    currentTouchFlowers++;
                    
                    // Animation đơn giản
                    let opacity = 0.8;
                    const fadeOut = () => {
                        opacity -= 0.02;
                        flower.style.opacity = opacity;
                        
                        if (opacity > 0) {
                            requestAnimationFrame(fadeOut);
                        } else {
                            flower.remove();
                            currentTouchFlowers--;
                        }
                    };
                    
                    fadeOut();
                    
                    // Tự động xóa sau 1.5 giây
                    setTimeout(() => {
                        if (flower.parentNode) {
                            flower.remove();
                            currentTouchFlowers--;
                        }
                    }, 1500);
                    
                }, i * 50);
            }
        }
        
        // Tạo pháo hoa (tối ưu)
        function createFirework() {
            if (currentFireworks >= MAX_FIREWORKS) return;
            
            const firework = document.createElement('div');
            firework.className = 'firework';
            
            const x = Math.random() * window.innerWidth;
            const y = Math.random() * window.innerHeight;
            const color = colors[Math.floor(Math.random() * colors.length)];
            
            firework.style.left = `${x}px`;
            firework.style.top = `${y}px`;
            firework.style.backgroundColor = color;
            firework.style.boxShadow = `0 0 8px ${color}`;
            
            fireworksContainer.appendChild(firework);
            currentFireworks++;
            
            // Số lượng particle ít hơn
            const particles = isLowPerformance ? 8 : 12;
            for (let i = 0; i < particles; i++) {
                createParticle(x, y, color);
            }
            
            setTimeout(() => {
                firework.remove();
                currentFireworks--;
            }, 800);
        }
        
        function createParticle(x, y, color) {
            const particle = document.createElement('div');
            particle.className = 'firework';
            
            particle.style.left = `${x}px`;
            particle.style.top = `${y}px`;
            particle.style.backgroundColor = color;
            particle.style.boxShadow = `0 0 5px ${color}`;
            
            fireworksContainer.appendChild(particle);
            
            const angle = Math.random() * Math.PI * 2;
            const speed = 0.5 + Math.random() * 2;
            const vx = Math.cos(angle) * speed;
            const vy = Math.sin(angle) * speed;
            
            let posX = x;
            let posY = y;
            let opacity = 1;
            
            const moveParticle = () => {
                posX += vx;
                posY += vy;
                opacity -= 0.03;
                
                particle.style.left = `${posX}px`;
                particle.style.top = `${posY}px`;
                particle.style.opacity = opacity;
                
                if (opacity > 0) {
                    requestAnimationFrame(moveParticle);
                } else {
                    particle.remove();
                }
            };
            
            moveParticle();
        }
        
        // Tạo hoa rơi (tối ưu)
        function createFlower() {
            if (currentFlowers >= MAX_FLOWERS) return;
            
            const flower = document.createElement('div');
            flower.className = 'flower';
            flower.innerHTML = flowers[Math.floor(Math.random() * flowers.length)];
            
            const x = Math.random() * window.innerWidth;
            
            flower.style.left = `${x}px`;
            flower.style.top = `-50px`;
            
            document.body.appendChild(flower);
            currentFlowers++;
            
            // Animation đơn giản
            const duration = 4000 + Math.random() * 3000;
            const startTime = Date.now();
            
            const animateFlower = () => {
                const elapsed = Date.now() - startTime;
                const progress = elapsed / duration;
                
                if (progress < 1) {
                    const y = -50 + (window.innerHeight + 100) * progress;
                    const rotation = progress * 360;
                    
                    flower.style.top = `${y}px`;
                    flower.style.transform = `rotate(${rotation}deg)`;
                    
                    requestAnimationFrame(animateFlower);
                } else {
                    flower.remove();
                    currentFlowers--;
                }
            };
            
            animateFlower();
            
            // Tự động xóa sau duration
            setTimeout(() => {
                if (flower.parentNode) {
                    flower.remove();
                    currentFlowers--;
                }
            }, duration);
        }
        
        // Khởi tạo với tần suất thấp hơn
        function initEffects() {
            checkPerformance();
            
            // Giảm tần suất tạo hiệu ứng
            const fireworkInterval = isLowPerformance ? 800 : 500;
            const flowerInterval = isLowPerformance ? 1200 : 800;
            
            setInterval(createFirework, fireworkInterval);
            setInterval(createFlower, flowerInterval);
            
            // Tạo hiệu ứng ban đầu
            setTimeout(() => {
                for (let i = 0; i < 3; i++) {
                    setTimeout(createFirework, i * 200);
                    setTimeout(createFlower, i * 300);
                }
            }, 500);
        }
        
        // Khởi chạy khi trang đã tải xong
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initEffects);
        } else {
            initEffects();
        }
        
        // Tối ưu hóa khi tab không active
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                // Giảm hiệu ứng khi tab không active
                fireworksContainer.innerHTML = '';
                touchContainer.innerHTML = '';
                currentFireworks = 0;
                currentTouchFlowers = 0;
                currentFlowers = 0;
            }
        });
    </script>
</body>
</html>
